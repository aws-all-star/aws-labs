---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboards
  labels:
    app.kubernetes.io/name: grafana
data:
  dashboards.yml: |-
    apiVersion: 1
    providers:
      - name: default # A uniquely identifiable name for the provider
        type: file
        allowUiUpdates: false
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: true
    dashboards:
      default:
        NodeJS:
          gnetId: 19062
          datasource: Prometheus
        Requests:
          gnetId: 20371
          datasource: Prometheus

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: datasources
  labels:
    app.kubernetes.io/name: grafana
data:
  prometheus.yaml: |-
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      editable: true
      isDefault: true
      url: http://prometheus-server
      jsonData:
        exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: Tempo
        manageAlerts: true
        prometheusType: Prometheus
        maxLines: 1000
  loki.yaml: |-
    apiVersion: 1
    datasources:
    - name: Loki
      type: loki
      access: proxy
      editable: true
      url: http://loki:3100
      jsonData:
        maxLines: 1000
        derivedFields:
          - datasourceUid: Tempo
            matcherRegex: '"trace_id":"(.+?)"'
            name: TraceID
            url: "$${__value.raw}"
